<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Extraction #CMH9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:           #FBF6EF;
            --bg-panel:     #ffffff;
            --bg-surface:   #f0ece3;
            --bg-input:     #f4eee4;
            --bg-hover:     #ebe4d8;
            --line:         rgba(28,60,48,0.12);
            --line-bright:  rgba(31,122,140,0.40);
            --accent:       #1f7a8c;
            --accent-dim:   rgba(31,122,140,0.12);
            --accent-glow:  rgba(31,122,140,0.30);
            --cyan:         #022b3a;
            --cyan-dim:     rgba(2,43,58,0.10);
            --text:         #022b3a;
            --text-2:       #2a5060;
            --text-3:       #7a9caa;
            --green:        #1f7a8c;
            --green-dim:    rgba(31,122,140,0.12);
            --red:          #b94040;
            --red-dim:      rgba(185,64,64,0.09);
            --r:            14px;
            --r-sm:         8px;
        }

        body.dm {
            --bg:           #022b3a;
            --bg-panel:     #03364a;
            --bg-surface:   #04415a;
            --bg-input:     #032f40;
            --bg-hover:     #064a65;
            --line:         rgba(191,219,247,0.10);
            --line-bright:  rgba(191,219,247,0.38);
            --accent:       #bfdbf7;
            --accent-dim:   rgba(191,219,247,0.13);
            --accent-glow:  rgba(191,219,247,0.28);
            --cyan:         #bfdbf7;
            --cyan-dim:     rgba(191,219,247,0.10);
            --text:         #e8f4ff;
            --text-2:       #bfdbf7;
            --text-3:       #4a7a9b;
            --green:        #bfdbf7;
            --green-dim:    rgba(191,219,247,0.12);
            --red:          #f87171;
            --red-dim:      rgba(248,113,113,0.10);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.35s, color 0.35s;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                radial-gradient(ellipse 80% 50% at 10% 0%, rgba(31,122,140,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 90% 100%, rgba(2,43,58,0.05) 0%, transparent 55%),
                linear-gradient(rgba(31,122,140,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(31,122,140,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
        }

        .wrap {
            position: relative; z-index: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 36px 32px 60px;
        }
        @media (min-width: 1400px) { .wrap { padding: 40px 48px 80px; } }
        @media (max-width: 900px)  { .wrap { padding: 20px 16px 40px; } }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(140deg, #022b3a 0%, #1f7a8c 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 0 1px rgba(31,122,140,0.35), 0 8px 20px rgba(31,122,140,0.20);
        }

        .brand-name { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
        .brand-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem; font-weight: 600;
            color: var(--accent); letter-spacing: 0.08em;
            text-transform: uppercase; margin-top: 2px;
        }

        .topbar-right { display: flex; align-items: center; gap: 10px; }

        .status-pill {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.72rem; font-weight: 600;
            font-family: 'IBM Plex Mono', monospace;
            padding: 7px 14px; border-radius: 99px;
            border: 1px solid var(--line); background: var(--bg-surface);
            color: var(--text-2);
        }

        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-3);
        }
        .status-dot.on {
            background: #10b981; box-shadow: 0 0 8px #10b981;
            animation: blink 2s ease infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

        #themeBtn {
            width: 38px; height: 38px;
            border: 1px solid var(--line); background: var(--bg-surface);
            border-radius: var(--r-sm); font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; color: var(--text-2);
        }
        #themeBtn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── LAYOUT ── */
        .layout {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (min-width: 1400px) { .layout { grid-template-columns: 360px 1fr; gap: 28px; } }
        @media (max-width: 990px)  { .layout { grid-template-columns: 1fr; } }

        /* ── PANEL ── */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: var(--r); overflow: hidden;
            box-shadow: 0 1px 0 var(--line), 0 8px 32px rgba(2,43,58,0.06);
            transition: background 0.35s, border-color 0.35s;
        }
        body.dm .panel { box-shadow: 0 1px 0 var(--line), 0 16px 40px rgba(0,0,0,0.40); }

        .panel-head {
            padding: 16px 22px 14px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 10px;
        }

        .panel-ico {
            width: 28px; height: 28px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center; font-size: 13px;
        }
        .ico-blue   { background: var(--accent-dim); border: 1px solid rgba(31,122,140,0.18); }
        .ico-cyan   { background: var(--cyan-dim); border: 1px solid rgba(2,43,58,0.12); }
        .ico-green  { background: var(--green-dim); border: 1px solid rgba(31,122,140,0.18); }
        .ico-yellow { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.25); }

        .panel-title {
            font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--accent); font-family: 'IBM Plex Mono', monospace;
        }

        .panel-body { padding: 20px 22px; }

        /* ── FIELD ── */
        .field { margin-bottom: 15px; }
        .field:last-child { margin-bottom: 0; }

        .f-label {
            font-size: 0.69rem; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--text-2); display: block; margin-bottom: 7px;
        }

        .f-input {
            width: 100%; height: 42px;
            background: var(--bg-input); border: 1px solid var(--line);
            border-radius: var(--r-sm); color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem;
            padding: 0 14px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .f-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .f-mono { font-family: 'IBM Plex Mono', monospace !important; font-size: 0.82rem; }

        .input-wrap { position: relative; }
        .eye-btn {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 14px; color: var(--text-3); cursor: pointer;
        }

        .field-hint {
            margin-top: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.69rem; font-weight: 500;
            color: var(--accent);
            display: flex; align-items: center; gap: 6px;
        }

        /* ── CONNECT BTN ── */
        .btn-connect {
            width: 100%; height: 42px;
            background: var(--accent-dim); border: 1px solid rgba(31,122,140,0.30);
            border-radius: var(--r-sm); color: var(--accent);
            font-size: 0.84rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s; margin-top: 10px;
        }
        .btn-connect:hover {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* ── MODE CARDS ── */
        .mode-stack { display: flex; flex-direction: column; gap: 8px; }
        .mode-card { position: relative; cursor: pointer; }
        .mode-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }

        .mode-inner {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border: 1px solid var(--line);
            border-radius: var(--r-sm); background: var(--bg-surface);
            transition: all 0.2s;
        }
        .mode-card input:checked + .mode-inner {
            border-color: var(--accent); background: var(--accent-dim);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .mode-ico {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--line); display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .mode-card input:checked + .mode-inner .mode-ico { background: var(--accent); color: #fff; }

        .mode-title { font-size: 0.81rem; font-weight: 700; color: var(--text); }
        .mode-desc  { font-size: 0.69rem; color: var(--text-2); margin-top: 2px; }

        .radio-ring {
            width: 17px; height: 17px; border: 2px solid var(--text-3);
            border-radius: 50%; margin-left: auto; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .mode-card input:checked + .mode-inner .radio-ring {
            border-color: var(--accent); background: var(--accent);
        }
        .mode-card input:checked + .mode-inner .radio-ring::after {
            content: ''; width: 5px; height: 5px;
            border-radius: 50%; background: #fff;
        }

        /* ── RIGHT COLUMN ── */
        .right-col { display: flex; flex-direction: column; gap: 20px; }
        .params-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        /* ── HEADERS PARAMETERS GRID ── */
        .headers-box { display: none; animation: revealDown 0.25s ease; }
        .clean-box   { display: none; animation: revealDown 0.25s ease; }

        @keyframes revealDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .headers-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .headers-2col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-items: end; }
        @media (max-width: 768px) {
            .headers-3col { grid-template-columns: 1fr; }
            .headers-2col { grid-template-columns: 1fr; }
        }

        .clean-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
        .checks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 620px) { .checks-grid { grid-template-columns: 1fr 1fr; } }

        .check-tile {
            display: flex; align-items: center; gap: 9px;
            height: 42px; padding: 0 14px; border: 1px solid var(--line);
            border-radius: var(--r-sm); background: var(--bg-surface);
            cursor: pointer; transition: all 0.15s;
        }
        .check-tile:hover { background: var(--bg-hover); }
        .check-tile input { accent-color: var(--accent); width: 16px; height: 16px; }
        .check-tile span { font-size: 0.77rem; font-weight: 600; color: var(--text-2); }

        /* ── EXTRACT BTN ── */
        .btn-extract {
            width: 100%; height: 50px;
            background: var(--accent); border: none; border-radius: var(--r-sm);
            color: #fff; font-size: 0.90rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.25s; box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-extract:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-extract:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .btn-logout {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; height: 42px; background: transparent;
            border: 1px solid rgba(185,64,64,0.30); border-radius: var(--r-sm);
            color: var(--red); font-size: 0.82rem; font-weight: 700;
            text-decoration: none; cursor: pointer; margin-top: 10px; transition: all 0.2s;
        }
        .btn-logout:hover { background: var(--red-dim); }

        /* ── RESULT PANEL ── */
        #resultPanel { display: none; }
        #resultTextarea {
            width: 100%; min-height: 380px;
            background: var(--bg-input); border: 1px solid var(--line);
            border-radius: var(--r-sm); color: var(--text);
            font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem;
            line-height: 1.6; padding: 18px 20px; outline: none;
        }

        .result-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
        .btn-action {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 18px; border-radius: var(--r-sm);
            font-size: 0.80rem; font-weight: 700; border: none; cursor: pointer;
        }
        .btn-copy { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(31,122,140,0.28); }
        .btn-download { background: var(--bg-surface); color: var(--text-2); border: 1px solid var(--line); }
        .btn-clear { background: transparent; color: var(--red); border: 1px solid var(--line); margin-left: auto; }

        .loading-wrap {
            margin-top: 14px; background: var(--bg-surface);
            border: 1px solid var(--line); border-radius: var(--r-sm);
            padding: 16px 20px; display: none;
        }
        .spin {
            width: 18px; height: 18px; border: 2px solid var(--line);
            border-top-color: var(--accent); border-radiu
